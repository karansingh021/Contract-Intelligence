manifest_version: 2

version:
  name: V1_1
  label: "Contract Intelligence · Revenue Leakage AI v1.1"
  comment: "AI-powered contract PDF extraction, multi-format data ingestion, leakage detection, and analytics"

artifacts:
  setup_script: scripts/setup.sql
  readme: README.md
  default_streamlit: app.revenue_leakage_dashboard

configuration:
  log_level: INFO
  trace_level: OFF

# Request CORTEX_USER database role for Cortex AI functions
snowflake_database:
  roles:
    - CORTEX_USER:
        description: "Required for Cortex AI functions (PARSE_DOCUMENT, COMPLETE) used in PDF extraction and contract intelligence"

# References: objects in the consumer account the app may read/write
references:
  - consumer_warehouse:
      label: "Processing Warehouse"
      description: "Warehouse used to run the ingestion pipeline, PDF extraction, and rule engine"
      privileges: [USAGE]
      object_type: WAREHOUSE
      register_callback: config.register_reference
